[project]
name = "job-hunt-kit"
version = "0.1.0"
description = "Tailored CVs and job search tracking, driven by Claude Desktop"
requires-python = ">=3.12,<3.13"
dependencies = ["python-docx>=1.1", "python-jobspy>=1.1.82", "docx2pdf>=0.1.8; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
