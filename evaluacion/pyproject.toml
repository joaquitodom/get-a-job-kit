[project]
name = "job-hunt-kit-evaluacion"
version = "0.1.0"
description = "Heavy ranking candidates, isolated from the main environment (JobSpy pins numpy 1.x)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "setfit>=1.1",
    "gliclass>=0.1.20",
    "laya>=0.3.20",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
